name: Full Automation Pipeline

on:
  push:
    branches: [ main ]        # Trigger on every push to main
  workflow_dispatch:          # Manual trigger from GitHub

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Step 1: Checkout your repository
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v3

      # -----------------------------
      # Step 2: Setup Java for Selenium + TestNG
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # -----------------------------
      # Step 3: Build Maven project
      # -----------------------------
      - name: Build Project
        run: mvn clean compile

      # -----------------------------
      # Step 4: Run Selenium TestNG tests
      # -----------------------------
      - name: Run Selenium Tests
        run: mvn test

      # -----------------------------
      # Step 5: Upload Selenium/TestNG reports
      # -----------------------------
      - name: Upload Selenium/TestNG Reports
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: target/surefire-reports/

      # -----------------------------
      # Step 6: Setup Node.js for Playwright + Newman
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # -----------------------------
      # Step 7: Install Node.js dependencies
      # -----------------------------
      - name: Install Node Dependencies
        run: npm install

      # -----------------------------
      # Step 8: Run Playwright Tests
      # -----------------------------
      - name: Run Playwright Tests
        run: npx playwright test

      # -----------------------------
      # Step 9: Upload Playwright Reports
      # -----------------------------
      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # -----------------------------
      # Step 10: Run Newman/Postman collection
      # -----------------------------
      - name: Run Newman Tests
        run: newman run collection.json -r cli,html

      # -----------------------------
      # Step 11: Upload Newman Reports
      # -----------------------------
      - name: Upload Newman HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman
